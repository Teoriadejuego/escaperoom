<body><main><h1>Cuestionario de estadística</h1><form id="setup"><p>Responde a 18 preguntas. Selecciona una respuesta y pulsa «Continuar» para registrarla. Al finalizar verás tu nota y podrás copiar el código para tu profesor.</p><label>Asignatura<select id="asignatura"></select></label><small id="origen" hidden>Banco provisional de Estadística I de Finanzas y Contabilidad.</small><label>Bloque<select id="bloque"></select></label><label>Dificultad<select id="dificultad"><option value="facil">Fácil</option><option value="dificil">Difícil</option></select></label><button id="iniciar" disabled>Comenzar</button><button type="button" id="retry" hidden>Reintentar la carga</button><p role="status" id="estado"></p></form><section id="sesion" hidden><small id="datos"></small><div id="contenido"></div></section></main></body></html>
