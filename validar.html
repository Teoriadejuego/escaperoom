<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validar código de partida</title>
<style>body{margin:8vh auto;max-width:38rem;padding:1.5rem;background:#faf7ed;color:#173d34;font:18px/1.5 system-ui}h1{font:2.4rem Georgia}label,input{display:block}input,button{font:inherit;padding:.65rem;margin:.5rem 0;border-radius:.35rem}input{max-width:90%}button{background:#173d34;color:white}output{display:block;font-weight:bold}a{color:#174c40}</style>
<script src="assets/codigo.js?v=2"></script></head><body><main><h1>Validar código de partida</h1><form><label for="codigo">Código recibido del estudiante</label><input id="codigo" required autocomplete="off" autocapitalize="characters" spellcheck="false"><button>Comprobar código</button></form><output id="resultado" role="status"></output><p>La comprobación verifica el formato y el cociente de control. El juego funciona en el navegador y carece de un registro central de códigos emitidos. Un código compatible puede copiarse o reproducirse.</p><a href="index.html">Abrir el juego</a></main>
<script>document.querySelector('form').onsubmit = event => {
  event.preventDefault();
  const dato = CodigosDePartida.leer(document.querySelector('#codigo').value);
  document.querySelector('#resultado').textContent = dato
    ? 'Cumple las reglas. ' + dato.grupo + '. Dificultad ' + dato.dificultad.toLowerCase() + '. Tiempo: ' + dato.minutos + (dato.minutos === 99 ? ' minutos o más.' : ' min completos.')
    : 'Código incorrecto. Comprueba que se ha copiado completo, incluido el signo @.';
};
document.querySelector('#codigo').oninput = () => document.querySelector('#resultado').textContent = '';
</script></body></html>
